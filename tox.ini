[tox]
envlist =
    linters
    py

[pytest]
# Makes all warnings be fatal
filterwarnings = error
junit_family = xunit1
testpaths = tests
addopts = --cov --cov-report=term --cov-report=html --cov-report=xml

[coverage:run]
branch = True
omit =
    */__init__.py

source =
    adventofcodeutils
    tests

[coverage:report]
# We're not yet started so test coverage will be low. Increase as time goes on
fail_under = 10
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover

    # Don't complain if tests don't hit defensive assertion code:
    raise NotImplementedError

[testenv]
deps =
    pytest
    pytest-cov
    pytest-xdist

commands =
    pytest {posargs} -n 4

[testenv:ruff]
skip_install = true
deps = ruff
commands =
    ruff check src/ tests/
    ruff format --check --diff src/ tests/

[testenv:mypy]
skip_install = true
description = type check ourselves
deps =
    mypy
    lxml
    attrs
commands =
    python -m mypy --config-file mypy.ini src/

# Combines all linters in one, fast, env
[testenv:linters]
skip_install = true
deps =
    {[testenv:ruff]deps}
    {[testenv:mypy]deps}
commands =
    {[testenv:ruff]commands}
    {[testenv:mypy]commands}
